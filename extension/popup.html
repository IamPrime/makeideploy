<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make I Deploy Today?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 400px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            color: #111111;
            padding: 0;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.state-no-deploy {
            background: #b4221b;
            color: #1a1a1a;
        }

        .container {
            padding: 24px;
            text-align: center;
        }

        .tagline {
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            font-size: 12px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
            margin-bottom: 20px;
        }

        .content {
            padding: 20px 0;
            margin-bottom: 16px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading {
            font-size: 14px;
            opacity: 0.7;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.3; }
        }

        .reason {
            font-size: 28px;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            word-break: break-word;
            hyphens: auto;
        }

        .badge {
            display: inline-block;
            margin-top: 16px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid currentColor;
            opacity: 0.75;
        }

        .metadata {
            font-size: 11px;
            opacity: 0.5;
            margin-top: 12px;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.state-no-deploy .controls {
            border-top-color: rgba(0, 0, 0, 0.2);
        }

        body.state-no-deploy .tagline,
        body.state-no-deploy .metadata,
        body.state-no-deploy label {
            opacity: 1;
            color: rgba(26, 26, 26, 0.85);
            text-shadow: 0 0 0.5px rgba(0, 0, 0, 0.2);
            -webkit-font-smoothing: antialiased;
        }

        body.state-no-deploy select {
            background: rgba(255, 255, 255, 0.2);
            color: #1a1a1a;
            border-color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
        }

        body.state-no-deploy select option {
            background: #b4221b;
            color: #1a1a1a;
        }

        label {
            display: block;
            font-size: 10px;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.6;
            margin-bottom: 4px;
        }

        select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            background: transparent;
            color: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        body.state-no-deploy select {
            border-color: rgba(0, 0, 0, 0.3);
        }

        select option {
            background: #fff;
            color: #111;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        button:hover {
            opacity: 0.8;
        }

        .btn-refresh {
            background: transparent;
            color: inherit;
            border: 1px solid currentColor;
            opacity: 0.7;
        }

        .btn-website {
            background: #111111;
            color: #ffffff;
            border: none;
        }

        body.state-no-deploy .btn-website {
            background: #1a1a1a;
            color: #ffffff;
        }

        .error {
            font-size: 13px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tagline" id="tagline">Make I Deploy Today?</div>

        <div class="content" id="content">
            <div class="loading">Checking the vibes...</div>
        </div>

        <div class="controls">
            <div>
                <label for="timezone">Timezone</label>
                <select id="timezone"></select>
            </div>
            <div>
                <label for="language">Language</label>
                <select id="language"></select>
            </div>
        </div>

        <div class="buttons">
            <button class="btn-refresh" id="refreshBtn">↻ Check Again</button>
            <button class="btn-website" id="websiteBtn">Visit Site</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
